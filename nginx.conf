server {
    listen 80;
    server_name compassionbenchmark.com www.compassionbenchmark.com;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 256;

    # ── Umami analytics reverse proxy ──────────────────────────
    location /u/ {
        proxy_pass http://umami-analytics-vi0p-umami-1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js static export: folder-based routes with index.html
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Legacy URL redirects (from old .html paths)
    rewrite ^/home\.html?$ / permanent;
    rewrite ^/home$ / permanent;
    rewrite ^/countries-index\.html?$ /countries permanent;
    rewrite ^/countries-index$ /countries permanent;
    rewrite ^/us-states-index\.html?$ /us-states permanent;
    rewrite ^/us-states-index$ /us-states permanent;
    rewrite ^/data-license\.html?$ /data-licenses permanent;
    rewrite ^/data-license$ /data-licenses permanent;
    rewrite ^/humanoid-robotics-labs\.html?$ /robotics-labs permanent;
    rewrite ^/humanoid-robotics-labs$ /robotics-labs permanent;
    rewrite ^/ai-labs\.html?$ /ai-labs permanent;
    rewrite ^/top-50-ai-labs\.html?$ /ai-labs permanent;
    rewrite ^/top-50-robotics-companies\.html?$ /robotics-labs permanent;
    rewrite ^/top-150-us-cities\.html?$ /us-cities permanent;
    rewrite ^/top-250-global-cities\.html?$ /global-cities permanent;
    rewrite ^/cities-index\.html?$ /global-cities permanent;

    # Structural merge (2026-09-14): Cabo Verde and Cape Verde were published as
    # duplicate rows; cape-verde is retired and cabo-verde is canonical.
    rewrite ^/country/cape-verde/?$ /country/cabo-verde permanent;

    # Structural fix (2026-09-14): global-cities Phoenix and us-cities Phoenix collided on slug
    # "phoenix"; the global city now carries the pinned slug phoenix-global-cities.
    rewrite ^/city/phoenix/?$ /city/phoenix-global-cities permanent;

    # A-2 tranche 1 (2026-09-16): the Singapore cross-index collision, where the
    # bare slug served the WRONG entity. The global-cities row now carries a
    # pinned slug matching the rotation-state key that already existed for it, so
    # /data/scores/singapore.json resolves to the COUNTRY (was the global city).
    # This rewrite moves the non-canonical PAGE to its pinned slug. Load-bearing:
    # RankingTable/IndexPageCharts/EntitySearch build hrefs from slugify(name) and
    # ignore the pinned slug, so without it the index page links to a 404.
    # NOT done here: 1X Technologies and Figure AI. RISK-017 defers them to D-13
    # ("proposed", unratified), whose hard constraint is that no entity may hold
    # more than one published composite. Pinning a slug per composite would
    # entrench the duplicate publication the decision exists to remove.
    rewrite ^/city/singapore/?$ /city/singapore-global-cities permanent;

    # RISK-023 (2026-09-16): 20 Fortune 500 names were published with HTML
    # entities (e.g. "Procter &amp;amp; Gamble"), which split each entity's slug
    # three ways (encoded page slug, differently-encoded record/rotation key,
    # and a natural URL guess that 404'd). Names are decoded at the source and
    # each entity now carries one pinned slug across pages, records and rotation.
    # See docs/REMEDIATION_RISK-023_ENCODED_NAMES_2026-09-15.md.
    rewrite ^/company/procter-andamp-gamble/?$ /company/procter-and-gamble permanent;
    rewrite ^/company/procter-gamble/?$ /company/procter-and-gamble permanent;
    rewrite ^/data/scores/procter-amp-gamble\.json$ /data/scores/procter-and-gamble.json permanent;
    rewrite ^/company/jack-henry-andamp-associate/?$ /company/jack-henry-and-associate permanent;
    rewrite ^/company/jack-henry-associate/?$ /company/jack-henry-and-associate permanent;
    rewrite ^/data/scores/jack-henry-amp-associate\.json$ /data/scores/jack-henry-and-associate.json permanent;
    rewrite ^/company/marsh-andamp-mclennan/?$ /company/marsh-and-mclennan permanent;
    rewrite ^/company/marsh-mclennan/?$ /company/marsh-and-mclennan permanent;
    rewrite ^/data/scores/marsh-amp-mclennan\.json$ /data/scores/marsh-and-mclennan.json permanent;
    rewrite ^/company/loweand-x27-s/?$ /company/lowes permanent;
    rewrite ^/company/lowe-s/?$ /company/lowes permanent;
    rewrite ^/data/scores/lowe-x27-s\.json$ /data/scores/lowes.json permanent;
    rewrite ^/company/bath-andamp-body-works/?$ /company/bath-and-body-works permanent;
    rewrite ^/company/bath-body-works/?$ /company/bath-and-body-works permanent;
    rewrite ^/data/scores/bath-amp-body-works\.json$ /data/scores/bath-and-body-works.json permanent;
    rewrite ^/company/kohland-x27-s/?$ /company/kohls permanent;
    rewrite ^/company/kohl-s/?$ /company/kohls permanent;
    rewrite ^/data/scores/kohl-x27-s\.json$ /data/scores/kohls.json permanent;
    rewrite ^/company/deere-andamp-company/?$ /company/deere-and-company permanent;
    rewrite ^/company/deere-company/?$ /company/deere-and-company permanent;
    rewrite ^/data/scores/deere-amp-company\.json$ /data/scores/deere-and-company.json permanent;
    rewrite ^/company/macyand-x27-s/?$ /company/macys permanent;
    rewrite ^/company/macy-s/?$ /company/macys permanent;
    rewrite ^/data/scores/macy-x27-s\.json$ /data/scores/macys.json permanent;
    rewrite ^/company/atandamp-t/?$ /company/at-and-t permanent;
    rewrite ^/company/at-t/?$ /company/at-and-t permanent;
    rewrite ^/data/scores/at-amp-t\.json$ /data/scores/at-and-t.json permanent;
    rewrite ^/company/caseyand-x27-s-general-stores/?$ /company/caseys-general-stores permanent;
    rewrite ^/company/casey-s-general-stores/?$ /company/caseys-general-stores permanent;
    rewrite ^/data/scores/casey-x27-s-general-stores\.json$ /data/scores/caseys-general-stores.json permanent;
    rewrite ^/company/dun-andamp-bradstreet/?$ /company/dun-and-bradstreet permanent;
    rewrite ^/company/dun-bradstreet/?$ /company/dun-and-bradstreet permanent;
    rewrite ^/data/scores/dun-amp-bradstreet\.json$ /data/scores/dun-and-bradstreet.json permanent;
    rewrite ^/company/helmerich-andamp-payne/?$ /company/helmerich-and-payne permanent;
    rewrite ^/company/helmerich-payne/?$ /company/helmerich-and-payne permanent;
    rewrite ^/data/scores/helmerich-amp-payne\.json$ /data/scores/helmerich-and-payne.json permanent;
    rewrite ^/company/leggett-andamp-platt/?$ /company/leggett-and-platt permanent;
    rewrite ^/company/leggett-platt/?$ /company/leggett-and-platt permanent;
    rewrite ^/data/scores/leggett-amp-platt\.json$ /data/scores/leggett-and-platt.json permanent;
    rewrite ^/company/owens-andamp-minor/?$ /company/owens-and-minor permanent;
    rewrite ^/company/owens-minor/?$ /company/owens-and-minor permanent;
    rewrite ^/data/scores/owens-amp-minor\.json$ /data/scores/owens-and-minor.json permanent;
    rewrite ^/company/park-hotels-andamp-resorts/?$ /company/park-hotels-and-resorts permanent;
    rewrite ^/company/park-hotels-resorts/?$ /company/park-hotels-and-resorts permanent;
    rewrite ^/data/scores/park-hotels-amp-resorts\.json$ /data/scores/park-hotels-and-resorts.json permanent;
    rewrite ^/company/sandamp-t-bancorp/?$ /company/s-and-t-bancorp permanent;
    rewrite ^/company/s-t-bancorp/?$ /company/s-and-t-bancorp permanent;
    rewrite ^/data/scores/s-amp-t-bancorp\.json$ /data/scores/s-and-t-bancorp.json permanent;
    rewrite ^/company/johnson-andamp-johnson/?$ /company/johnson-and-johnson permanent;
    rewrite ^/company/johnson-johnson/?$ /company/johnson-and-johnson permanent;
    rewrite ^/data/scores/johnson-amp-johnson\.json$ /data/scores/johnson-and-johnson.json permanent;
    rewrite ^/company/ballyand-x27-s-corporation/?$ /company/ballys-corporation permanent;
    rewrite ^/company/bally-s-corporation/?$ /company/ballys-corporation permanent;
    rewrite ^/data/scores/bally-x27-s-corporation\.json$ /data/scores/ballys-corporation.json permanent;
    rewrite ^/company/wandamp-t-offshore/?$ /company/w-and-t-offshore permanent;
    rewrite ^/company/w-t-offshore/?$ /company/w-and-t-offshore permanent;
    rewrite ^/data/scores/w-amp-t-offshore\.json$ /data/scores/w-and-t-offshore.json permanent;
    rewrite ^/company/bed-bath-andamp-beyond/?$ /company/bed-bath-and-beyond permanent;
    rewrite ^/company/bed-bath-beyond/?$ /company/bed-bath-and-beyond permanent;
    rewrite ^/data/scores/bed-bath-amp-beyond\.json$ /data/scores/bed-bath-and-beyond.json permanent;

    # Strip .html extension from any direct .html request
    rewrite ^/(.+)\.html$ /$1 permanent;

    # Cache Next.js hashed static assets aggressively
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache other static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Custom error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
