name: Deploy to VPS

# Triggers on every push to main. Also exposes a manual trigger in the GitHub
# Actions UI ("Run workflow") so deploys can be re-run without a new commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys: if two pushes arrive close together, the second waits for
# the first to finish rather than racing it. We never cancel an in-flight
# deploy mid-build (could leave the VPS in a half-rebuilt state).
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────
  # 0. WORKER TYPECHECK.
  #
  # Deliberately NOT a dependency of `deploy`. The Worker deploys to
  # Cloudflare, the site deploys to the VPS; coupling them would let a
  # Worker type error block an unrelated site release. This job going red
  # is the signal, not a gate on the VPS pipeline.
  #
  # It exists because `npm run typecheck` in worker/ had NEVER passed:
  # src/index.ts referenced FormDataEntryValue, a DOM lib type that
  # @cloudflare/workers-types does not declare, so every run failed TS2304.
  # A script that is never executed in CI is a dead guard — the same class
  # of defect as the product-separation validator that was wired to nothing.
  # ────────────────────────────────────────────────────────────────────
  worker-typecheck:
    name: Worker typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci || npm install
      - name: tsc --noEmit
        run: npm run typecheck

  # ────────────────────────────────────────────────────────────────────
  # 1. BUILD + TEST on the runner BEFORE touching the VPS.
  # If npm test or npm run build fails here, the deploy job never runs —
  # a known-broken commit cannot reach production.
  # ────────────────────────────────────────────────────────────────────
  test:
    name: Build + test (runner)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      # Node 24, not 20. site/scripts/test-entity-href.mjs imports
      # src/lib/entityHref.ts directly and relies on Node's native TypeScript
      # type-stripping, which landed in Node 22 and is on by default from 23.
      # On Node 20 that import throws ERR_UNKNOWN_FILE_EXTENSION and `npm test`
      # dies before the deploy job runs — which silently blocked every deploy
      # from 2026-07-19 onward (three consecutive ~30s failures).
      # 24 matches the local development environment the build is verified in.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests (scoring + lint, 80 cases)
        run: npm test

      - name: "Build static export (catches lint:briefings + validate-indexes)"
        run: npm run build

  # ────────────────────────────────────────────────────────────────────
  # 1a2. CB-PROBE TEST SUITE.
  #
  # tools/cb-probe is a separate zero-runtime-dependency package (its own
  # package.json, its own `node --test` suite) that is NOT part of site/'s
  # `npm test` chain, so none of its guarantees -- the vocabulary ban, the
  # write-root guard, the honest-labelling validators, the outbound
  # boundary check -- ran anywhere except a human's own machine before this
  # job existed. A separate job (not folded into `test` above) so a failure
  # here names itself as "cb-probe", not one line buried inside site's ~40
  # aggregate test scripts. No `npm ci`/`npm install` step: cb-probe
  # declares zero dependencies and devDependencies by design (enforced by
  # its own tests/no-network-scan.test.mjs), so there is nothing to install.
  # ────────────────────────────────────────────────────────────────────
  cb-probe-test:
    name: cb-probe test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/cb-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run cb-probe's test suite (zero dependencies -- no install step needed)
        run: npm test

  # ────────────────────────────────────────────────────────────────────
  # 1b. NGINX CONFIG SYNTAX CHECK.
  #
  # nginx.conf is the file the Docker image actually bakes in and ships
  # (Dockerfile: `COPY nginx.conf /etc/nginx/conf.d/default.conf`) — see
  # DEPLOYMENT.md for the full explanation of why nginx-ssl.conf is NOT
  # what production runs day to day. `npm test`'s parity gate
  # (test-nginx-redirect-parity.mjs) only checks the `rewrite` directives
  # textually; it cannot catch a config that is simply broken (typo,
  # mismatched brace, bad regex). This runs the real nginx binary's own
  # validator against the exact file the image ships, inside the same
  # nginx:alpine base image the Dockerfile builds from — no docker daemon
  # is needed locally to reproduce this, but GitHub Actions runners have
  # one, so we use it here.
  # ────────────────────────────────────────────────────────────────────
  nginx-config-syntax:
    name: nginx.conf syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "nginx -t against nginx.conf (nginx:alpine)"
        run: |
          docker run --rm \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

  # ────────────────────────────────────────────────────────────────────
  # 2. DEPLOY to the VPS via SSH.
  # Pulls latest main + rebuilds the Docker image + restarts the container.
  # Uses --ff-only so a divergent VPS state fails loudly instead of being
  # silently overwritten.
  # ────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [test, cb-probe-test, nginx-config-syntax]
    # MANUAL DEPLOY ONLY (2026-09-21). Previously this ran on every push to main,
    # so the coordinator suppressed auto-deploy by putting [skip ci] on the push tip.
    # That silenced the ENTIRE workflow: 12 commits went unbuilt and untested by CI
    # between 2026-09-17 and 2026-09-21, and three committed briefings 404d in
    # production because nothing shipped them. Gating the deploy job here means a
    # push always runs build + test + nginx syntax, while shipping stays a deliberate
    # human act (Actions -> Run workflow, or ./deploy.sh on the VPS).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets are configured
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=()
          [ -z "$VPS_HOST" ] && missing+=("VPS_HOST")
          [ -z "$VPS_USER" ] && missing+=("VPS_USER")
          [ -z "$VPS_SSH_KEY" ] && missing+=("VPS_SSH_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub secrets: ${missing[*]}"
            echo "::error::Add them at: https://github.com/Klingdom/applied-compassion-benchmark/settings/secrets/actions"
            echo "::error::Setup guide: docs/SETUP_AUTO_DEPLOY.md"
            exit 1
          fi
          echo "All required secrets are configured."

      - name: SSH + pull + rebuild
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true  # abort on first non-zero command
          script: |
            set -euo pipefail
            cd applied-compassion-benchmark
            echo "→ Fetching latest main"
            git fetch origin main
            git pull --ff-only origin main
            echo "→ Rebuilding Docker image + restarting container"
            # Commit identity for scripts/build-manifest.mjs (BM-1). The Docker
            # build context contains no .git, so build-manifest.mjs cannot shell
            # out for the sha — it must be injected here. deploy.sh does the same
            # for manual deploys, but CI never invokes deploy.sh, so exporting it
            # there alone would leave every CI deploy recording git as
            # "unavailable". The VPS has .git (it just pulled), so this works.
            export GIT_SHA="$(git rev-parse --short HEAD)"
            export GIT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
            echo "→ git status --porcelain (names any file GIT_DIRTY below is reacting to):"
            git status --porcelain
            if [ -z "$(git status --porcelain)" ]; then export GIT_DIRTY=false; else export GIT_DIRTY=true; fi
            echo "→ GIT_DIRTY=$GIT_DIRTY"
            docker compose up -d --build
            echo "→ Pruning dangling images to reclaim disk"
            docker image prune -f
            echo "→ Container status:"
            docker compose ps

  # ────────────────────────────────────────────────────────────────────
  # 3. HEALTH CHECK against the live site.
  # Waits briefly for the container to come up, then probes critical paths.
  # If any probe fails, the workflow fails — making it visible in GitHub
  # and (if configured) sending you a notification.
  # ────────────────────────────────────────────────────────────────────
  verify:
    name: Post-deploy health check
    needs: deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Needed by the freshness assertion below, which compares what this
      # commit expects to publish against what the live host actually serves.
      - uses: actions/checkout@v4

      - name: Wait for container restart (~30s)
        run: sleep 30

      - name: Homepage returns 200
        run: curl -fsS -o /dev/null -w "homepage=%{http_code}\n" https://compassionbenchmark.com/

      - name: /updates returns 200
        run: curl -fsS -o /dev/null -w "updates=%{http_code}\n" https://compassionbenchmark.com/updates

      - name: /data/index.json is served and non-empty
        run: |
          size=$(curl -fsS https://compassionbenchmark.com/data/index.json | wc -c)
          echo "index.json size: $size bytes"
          if [ "$size" -lt 100 ]; then
            echo "::error::data/index.json is suspiciously small — deploy may have failed"
            exit 1
          fi

      - name: "Per-entity score file is served (sample: slovakia)"
        run: |
          payload=$(curl -fsS https://compassionbenchmark.com/data/scores/slovakia.json || echo "")
          if [ -z "$payload" ]; then
            echo "::error::data/scores/slovakia.json not served — deploy may have failed"
            exit 1
          fi
          composite=$(echo "$payload" | grep -oP '"composite"\s*:\s*\K[0-9.]+' | head -1)
          updated=$(echo "$payload" | grep -oP '"updatedAt"\s*:\s*"\K[0-9-]+' | head -1)
          echo "Slovakia composite=$composite updatedAt=$updated"

      # ────────────────────────────────────────────────────────────────
      # FRESHNESS ASSERTION — the check that actually proves a deploy landed.
      #
      # Every probe above passes against a STALE container. The site is a
      # static export baked into the image at build time, so if `docker compose
      # build` reuses a cached layer the container restarts happily, returns
      # 200 everywhere, and serves last week's scores.
      #
      # That is not hypothetical: between 2026-08-16 and 2026-08-19 the live
      # site served Uganda at 20.3 while main had 11.9, across six pushes,
      # with every check above green throughout.
      #
      # This step compares the briefing date THIS COMMIT expects to publish
      # against the one the live host is actually serving. They must match.
      # ────────────────────────────────────────────────────────────────
      - name: "Live site serves this commit's content (freshness assertion)"
        run: |
          expected=$(node -p "require('./site/src/data/updates/manifest.json').latest")
          if [ -z "$expected" ] || [ "$expected" = "undefined" ]; then
            echo "::error::Could not read .latest from site/src/data/updates/manifest.json"
            exit 1
          fi

          live=$(curl -fsS https://compassionbenchmark.com/updates/feed.json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const f=JSON.parse(s);
                const i=(f.items||[])[0]||{};
                process.stdout.write(String(i.date_published||'').slice(0,10));
              });")

          echo "expected latest briefing: $expected"
          echo "live latest briefing:     $live"

          if [ "$expected" != "$live" ]; then
            echo "::error::STALE DEPLOY — the host is serving '$live' but this commit publishes '$expected'."
            echo "::error::The container restarted but did not pick up new content (cached Docker layer)."
            echo "::error::Remedy on the VPS: docker compose build --no-cache web && docker compose up -d"
            exit 1
          fi
          echo "Freshness OK — live content matches this commit."

      # ────────────────────────────────────────────────────────────────
      # POST-DEPLOY REDIRECT SWEEP (LC-1a).
      #
      # nginx.conf is the file the Docker image ships (see DEPLOYMENT.md),
      # and the parity gate in `npm test` only proves the two nginx config
      # files agree with each other textually — it never asks the live,
      # deployed container what it actually does. This step does: it hits
      # every one of the 26 legacy `/robotics-lab/<legal-name>` and
      # `/us-state/georgia` URLs (previously missing from nginx.conf and
      # so 404ing in production even though nginx-ssl.conf carried the
      # redirect), plus the phoenix/singapore cross-index-collision
      # redirects and a sample of the older .html legacy paths, and
      # confirms each one lands on 200 at its real target — never on
      # /404. A NEGATIVE CONTROL (a slug that was never published) proves
      # the sweep can actually detect a miss: it must land on /404, and if
      # it doesn't, the sweep's own logic is broken and the step fails.
      # ────────────────────────────────────────────────────────────────
      - name: "Legacy URL redirect sweep (26 robotics-lab/georgia + phoenix/singapore + .html sample)"
        run: |
          set +e
          BASE="https://compassionbenchmark.com"
          checked=0
          ok=0
          hit_404=0

          # path|expected-target-prefix. A bash array, not a heredoc: this
          # script lives inside an indented YAML block scalar, and a heredoc
          # terminator here would carry the block's leading whitespace and
          # fail to match, silently swallowing the rest of the step.
          urls=(
            "/robotics-lab/intuitive-surgical-inc|/robotics-lab/intuitive-surgical"
            "/robotics-lab/cmr-surgical-ltd|/robotics-lab/cmr-surgical"
            "/robotics-lab/myomo-inc|/robotics-lab/myomo"
            "/robotics-lab/yaskawa-electric-corporation|/robotics-lab/yaskawa-electric"
            "/robotics-lab/kuka-ag|/robotics-lab/kuka"
            "/robotics-lab/glidance-inc|/robotics-lab/glidance"
            "/robotics-lab/procept-biorobotics-corporation|/robotics-lab/procept-biorobotics"
            "/robotics-lab/relay-robotics-inc|/robotics-lab/relay-robotics"
            "/robotics-lab/skydio-inc|/robotics-lab/skydio"
            "/robotics-lab/symbotic-inc|/robotics-lab/symbotic"
            "/robotics-lab/tyromotion-gmbh|/robotics-lab/tyromotion"
            "/robotics-lab/german-bionic-systems-gmbh|/robotics-lab/german-bionic"
            "/robotics-lab/scewo-ag|/robotics-lab/scewo"
            "/robotics-lab/distalmotion-sa|/robotics-lab/distalmotion"
            "/robotics-lab/ecovacs-robotics-co-ltd|/robotics-lab/ecovacs-robotics"
            "/robotics-lab/whill-inc|/robotics-lab/whill"
            "/robotics-lab/doosan-robotics-inc|/robotics-lab/doosan-robotics"
            "/robotics-lab/beijing-roborock-technology-co-ltd|/robotics-lab/roborock"
            "/robotics-lab/agibot-zhiyuan-robotics|/robotics-lab/agibot"
            "/robotics-lab/beijing-geekplus-technology-co-ltd|/robotics-lab/geekplus"
            "/robotics-lab/franka-robotics-gmbh|/robotics-lab/franka-robotics"
            "/robotics-lab/mujin-inc|/robotics-lab/mujin"
            "/robotics-lab/globus-medical-inc|/robotics-lab/globus-medical"
            "/robotics-lab/rainbow-robotics-co-ltd|/robotics-lab/rainbow-robotics"
            "/robotics-lab/avidbots-corp|/robotics-lab/avidbots"
            "/us-state/georgia|/us-state/georgia-us-states"
            "/city/phoenix|/city/phoenix-global-cities"
            "/city/singapore|/city/singapore-global-cities"
            "/countries-index.html|/countries"
            "/home.html|/"
            "/data-license.html|/data-licenses"
            "/humanoid-robotics-labs.html|/robotics-labs"
          )

          fail=0
          for entry in "${urls[@]}"; do
            path="${entry%%|*}"
            expected="${entry#*|}"
            checked=$((checked+1))
            effective=$(curl -sS -o /dev/null -L -w '%{url_effective}' "$BASE$path")
            got_path="${effective#$BASE}"
            [ -z "$got_path" ] && got_path="/"
            if [ "$got_path" = "/404" ] || [ "$got_path" = "/404/" ]; then
              hit_404=$((hit_404+1))
              echo "::error::REDIRECT SWEEP: $path landed on 404 (expected $expected)"
              fail=1
            elif [ "${got_path#$expected}" != "$got_path" ]; then
              ok=$((ok+1))
            else
              echo "::error::REDIRECT SWEEP: $path landed on '$got_path', expected prefix '$expected'"
              fail=1
            fi
          done

          echo "── Negative control: a slug that was never published must still end at /404 ──"
          neg_effective=$(curl -sS -o /dev/null -L -w '%{url_effective}' "$BASE/robotics-lab/totally-nonexistent-slug-zzz99")
          neg_path="${neg_effective#$BASE}"
          checked=$((checked+1))
          if [ "$neg_path" = "/404" ] || [ "$neg_path" = "/404/" ]; then
            echo "Negative control OK: nonsense slug correctly landed on /404 (proves the sweep can detect a real miss)."
          else
            echo "::error::REDIRECT SWEEP NEGATIVE CONTROL FAILED: nonsense slug landed on '$neg_path', not /404 — the sweep cannot be trusted to detect a real 404."
            fail=1
          fi

          echo ""
          echo "Redirect sweep: $checked checked, $ok landed correctly, $hit_404 unexpectedly hit /404."

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
